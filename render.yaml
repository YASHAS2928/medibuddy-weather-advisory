services:
  - type: web
    name: medibuddy-weather-advisory-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

  - type: web
    name: medibuddy-weather-advisory-ui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run frontend/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: medibuddy-weather-advisory-api
          property: hostport
