        intent:
          location: Bhopal
          activity: cycling
          audience: adult
          time_reference: {kind: now}
        location_fixture: bhopal
        weather: {wind_speed_kmh: 46.2}
        expected: {status: success, matched_policy_ids: [SOP-WIND-CYCLING-01]}
      - message: Try the weather again.
        intent: {}
        location_fixture: bhopal
        weather_error: Weather provider unavailable
        expected:
          status: weather_error
          context: {location: Bhopal, activity: cycling}
          absent_state_fields: [weather, matched_policies, policy_evaluations]
